name: Channel Watcher

# Watch-only agent: reads the channel's stats every morning and posts a report as a
# GitHub Issue (label "channel-report"). It never changes uploads or the lineup.
on:
  schedule:
    - cron: "11 4 * * *"      # 09:41 IST
  workflow_dispatch:

permissions:
  contents: write             # save state/stats.json (daily snapshots)
  issues: write               # post the report

concurrency: channel-watch

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install google-api-python-client google-auth google-genai

      - name: Watch the channel and post the report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # optional: Hinglish summary (free tier)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m shorts.watch

      - name: Save stats history
        if: success()
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/stats.json
          git commit -m "Channel stats $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
