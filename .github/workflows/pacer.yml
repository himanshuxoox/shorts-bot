name: Shorts Pacer

# Repo variable PACING decides what this does:
#   PACING = slots  -> fixed slots: every queued Short is uploaded and scheduled by YouTube at the
#                      next free slot (PUBLISH_SLOTS, default every 4 h). No view checks.
#   PACING = on     -> smart pacing: watch the live Short's views and hold / release (shorts/pacer.py).
#   anything else   -> this workflow does nothing.
on:
  schedule:
    - cron: "23 * * * *"      # twice an hour: GitHub often skips or delays scheduled runs,
    - cron: "53 * * * *"      # so two entries make a check at least every hour or so much more likely
  workflow_dispatch:          # "Run workflow" = check right now

permissions:
  contents: write             # pacer-queue release (queued videos + state) and uploads_out.json

concurrency:
  group: shorts-pacer
  cancel-in-progress: false

jobs:
  tick:
    if: vars.PACING == 'on' || vars.PACING == 'slots'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install google-api-python-client google-auth

      - name: Fixed slots — schedule queued Shorts
        if: vars.PACING == 'slots'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || '03:30,07:30,11:30,15:30,19:30,23:30' }}
          PACE_DRAIN_MAX: ${{ vars.PACE_DRAIN_MAX || '3' }}
        run: python -m shorts.pacer drain

      - name: Check the live Short, maybe release the next one
        if: vars.PACING == 'on'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PACE_CHECK_H: ${{ vars.PACE_CHECK_H }}
          PACE_GRACE_H: ${{ vars.PACE_GRACE_H }}
          PACE_MIN_VIEWS: ${{ vars.PACE_MIN_VIEWS }}
          PACE_HOT_GROWTH: ${{ vars.PACE_HOT_GROWTH }}
          PACE_STALL_GROWTH: ${{ vars.PACE_STALL_GROWTH }}
          PACE_TARGET: ${{ vars.PACE_TARGET }}
          PACE_STRONG_GROWTH: ${{ vars.PACE_STRONG_GROWTH }}
          PACE_STRONG_LIKE: ${{ vars.PACE_STRONG_LIKE }}
          PACE_MAX_HOLD_H: ${{ vars.PACE_MAX_HOLD_H }}
          PACE_STALE_DAYS: ${{ vars.PACE_STALE_DAYS }}
        run: python -m shorts.pacer tick

      - name: Save which format each video is (for the Channel Watcher)
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/uploads_out.json state/schedule_out.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Pacer scheduled / released Shorts"
          git pull --rebase && git push
