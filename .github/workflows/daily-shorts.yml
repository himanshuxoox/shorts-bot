name: Daily Shorts

on:
  schedule:
    - cron: "30 1 * * *"      # 07:00 IST every day
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      count:
        description: "How many videos"
        default: "4"

permissions:
  contents: write             # to commit state/history.json (no repeated seeds)

concurrency: daily-shorts

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Render today's batch
        run: python -m shorts.batch --count "${{ github.event.inputs.count || '4' }}" --workers 2

      - name: Upload to YouTube (only when AUTO_UPLOAD = true)
        if: vars.AUTO_UPLOAD == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || '08:30,12:30,17:30,21:00' }}
        run: python -m shorts.upload

      - name: Keep videos as a downloadable artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 7

      - name: Save seed history
        if: success()
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json
          git commit -m "Daily batch $(date -u +%F)" || echo "nothing to commit"
          git push
