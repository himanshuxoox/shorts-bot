name: Daily Shorts

on:
  schedule:
    # GitHub sometimes delays or drops scheduled runs, so there are 3 tries.
    # The "Already done today?" step makes the extra ones exit in seconds.
    - cron: "17 0 * * *"      # 05:47 IST
    - cron: "43 1 * * *"      # 07:13 IST (backup)
    - cron: "29 3 * * *"      # 08:59 IST (backup)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      count:
        description: "How many videos"
        default: "4"
      force:
        description: "Run even if today's batch already exists"
        default: "false"

permissions:
  contents: write             # to commit state/history.json (no repeated seeds)

concurrency: daily-shorts

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.inputs.force }}" != "true" ] && grep -q "\"date\": \"$TODAY\"" state/history.json; then
            echo "Batch for $TODAY already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: System packages
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Python packages
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Trend scout (safe trending words for ball names)
        if: steps.check.outputs.skip != 'true' && vars.TRENDS == 'on'   # off unless you set TRENDS=on
        continue-on-error: true          # never blocks the videos; no words = normal colors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m shorts.trends

      - name: Render today's batch
        if: steps.check.outputs.skip != 'true'
        env:
          FORMATS: ${{ vars.FORMATS }}
          TRENDS: ${{ vars.TRENDS == 'on' && 'on' || 'off' }}
        run: python -m shorts.batch --count "${{ github.event.inputs.count || '4' }}" --workers 2

      - name: Upload to YouTube (only when AUTO_UPLOAD = true)
        if: steps.check.outputs.skip != 'true' && vars.AUTO_UPLOAD == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || '08:30,12:30,17:30,21:00' }}
        run: python -m shorts.upload

      - name: Keep videos as a downloadable artifact (7 days)
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 7

      - name: Save seed history
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json state/trends.json 2>/dev/null || git add state/history.json
          git commit -m "Daily batch $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
