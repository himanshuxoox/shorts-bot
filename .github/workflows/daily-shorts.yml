name: Daily Shorts

on:
  schedule:
    - cron: "41 20 * * *"     # 02:11 IST — GitHub often runs schedules 5-6 h late
    # GitHub sometimes delays or drops scheduled runs, so there are 3 tries.
    # The "Already done today?" step makes the extra ones exit in seconds.
    - cron: "17 0 * * *"      # 05:47 IST
    - cron: "43 1 * * *"      # 07:13 IST (backup)
    - cron: "29 3 * * *"      # 08:59 IST (backup)
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      count:
        description: "How many videos"
        default: "4"
      force:
        description: "Run even if today's batch already exists"
        default: "false"

permissions:
  contents: write             # to commit state/history.json (no repeated seeds)

concurrency: daily-shorts

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event.inputs.force }}" != "true" ] && grep -q "\"date\": \"$TODAY\"" state/history.json; then
            echo "Batch for $TODAY already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: System packages
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
          # ManimGL formats: virtual screen + software OpenGL + pango for text
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 libglu1-mesa libpango1.0-dev
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Python packages
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt -r requirements-mgl.txt

      - name: Trend scout (safe trending words for ball names)
        if: steps.check.outputs.skip != 'true' && vars.TRENDS == 'on'   # off unless you set TRENDS=on
        continue-on-error: true          # never blocks the videos; no words = normal colors
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m shorts.trends

      - name: How many Shorts to render
        id: count
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACE_QUEUE_MAX: ${{ vars.PACE_QUEUE_MAX }}
          PACING: ${{ vars.PACING }}
        run: |
          WANT="${{ github.event.inputs.count || '6' }}"
          if [ "${{ vars.PACING }}" = "on" ] || [ "${{ vars.PACING }}" = "slots" ]; then
            # smart pacing: don't pile up more than PACE_QUEUE_MAX unreleased Shorts
            N=$(python -m shorts.pacer need --want "$WANT" || echo "$WANT")
          else
            N="$WANT"
          fi
          echo "Rendering $N Shorts"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Render today's batch
        if: steps.check.outputs.skip != 'true'
        env:
          FORMATS: ${{ vars.FORMATS }}
          EXTRA_FORMATS: ${{ vars.EXTRA_FORMATS || 'none' }}   # Shorts only. Set to royale for a daily long video
          TRENDS: ${{ vars.TRENDS == 'on' && 'on' || 'off' }}
        run: python -m shorts.batch --count "${{ steps.count.outputs.n }}" --workers 2

      - name: Upload to YouTube at fixed slots (AUTO_UPLOAD = true, PACING off)
        if: steps.check.outputs.skip != 'true' && vars.AUTO_UPLOAD == 'true' && vars.PACING != 'on' && vars.PACING != 'slots'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_SLOTS: ${{ vars.PUBLISH_SLOTS || '03:30,07:30,11:30,15:30,19:30,23:30' }}
        run: python -m shorts.upload

      - name: Smart pacing (PACING = on) — queue the Shorts, schedule only the long video
        if: steps.check.outputs.skip != 'true' && vars.AUTO_UPLOAD == 'true' && (vars.PACING == 'on' || vars.PACING == 'slots')
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SLOTS: ${{ vars.LONG_SLOTS || '21:00' }}
        run: |
          DAY=$(ls out | sort | tail -1)
          if [ -f "out/$DAY/manifest.json" ]; then
            python -m shorts.pacer enqueue --date "$DAY"
            python -m shorts.upload --date "$DAY" --long-only
          else
            echo "nothing rendered today"
          fi

      - name: Keep videos as a downloadable artifact (7 days)
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: out/
          retention-days: 7

      - name: Save seed history
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json
          git add state/trends.json state/schedule_out.json state/uploads_out.json 2>/dev/null || true
          git commit -m "Daily batch $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
