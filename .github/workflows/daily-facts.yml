name: Daily Facts

on:
  schedule:
    # 3 tries because GitHub sometimes delays/drops scheduled runs; extra ones skip in seconds.
    - cron: "53 0 * * *"      # 06:23 IST
    - cron: "11 2 * * *"      # 07:41 IST (backup)
    - cron: "43 3 * * *"      # 09:13 IST (backup)
    - cron: "41 20 * * *"     # 02:11 IST (GitHub often runs 5-6 h late)
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos"
        default: "4"

permissions:
  contents: write

concurrency: daily-facts

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Already done today?
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f state/facts_history.json ] && grep -q "\"date\": \"$TODAY\"" state/facts_history.json; then
            echo "Facts batch for $TODAY already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-facts.txt

      - name: Cache voice model
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v1

      - name: System packages
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config espeak-ng
          mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Python packages
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-facts.txt

      - name: Make today's facts Shorts
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}     # optional
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # optional
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}   # optional, paid
        run: python -m facts.batch --count "${{ github.event.inputs.count || '4' }}"

      - name: Upload to YouTube (only when AUTO_UPLOAD_FACTS = true)
        if: steps.check.outputs.skip != 'true' && vars.AUTO_UPLOAD_FACTS == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_FACTS_REFRESH_TOKEN }}
          PUBLISH_SLOTS: ${{ vars.FACTS_PUBLISH_SLOTS || '07:30,13:30,18:30,22:00' }}
        run: python -m shorts.upload --out out_facts

      - name: Keep videos as a downloadable artifact (7 days)
        if: always() && steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: facts-${{ github.run_number }}
          path: out_facts/
          retention-days: 7

      - name: Save topic history
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/facts_history.json
          git commit -m "Facts batch $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase && git push
